# Maritime Zero Trust Architecture
# Matrice autorevole delle identità utente-hardware protette da TPM.
#
# Formato:
# USER_ID|DEVICE_ID|CLIENT_SERVICE|TPM_HANDLE|DEVICE_LOCATION|NETWORK_NAME
#
# Ogni riga rappresenta una distinta identità crittografica:
# - chiave privata separata nel TPM del dispositivo;
# - certificato X.509 separato firmato dalla CA del progetto;
# - nessuna chiave privata esportata su file.
# Lo stesso utente può comparire su più dispositivi: ogni coppia
# utente-dispositivo ha un certificato e un handle TPM dedicati.

