# Maritime Zero Trust Architecture
# Matrice autorevole delle identita utente-hardware TPM-backed.
#
# Formato:
# USER_ID|DEVICE_ID|CLIENT_SERVICE|TPM_HANDLE|DEVICE_LOCATION|NETWORK_NAME
#
# Ogni riga rappresenta una distinta identita crittografica:
# - chiave privata separata nel TPM del dispositivo;
# - certificato X.509 separato firmato dalla CA del progetto;
# - nessuna chiave privata esportata su file.

operatore_ancona|D-001|client_d001_tpm|0x81000011|Terminal-Ancona|vpn_net
capitano_claudia|D-002|client_d002_tpm|0x81000022|Ponte-Comando|satellite_net
soc_admin|D-SOC|client_dsoc_tpm|0x81000031|SOC-Center|corporate_net
