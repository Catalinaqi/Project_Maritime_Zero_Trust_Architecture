systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /certs/mongodb/mongodb.pem
    CAFile: /certs/mongodb/ca.crt
    allowConnectionsWithoutCertificates: true

security:
  authorization: enabled