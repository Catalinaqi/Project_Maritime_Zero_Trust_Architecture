# Configurazione MongoDB per Maritime Zero Trust Architecture.
# La sicurezza del database è garantita da tre livelli complementari:
#   1. TLS obbligatorio con verifica reciproca del certificato client.
#   2. Autenticazione MongoDB tramite account applicativo a privilegi minimi.
#   3. Isolamento di rete: backend_net è dichiarata internal:true in Docker Compose.

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

net:
  port: 27017
  # 0.0.0.0 è necessario per ricevere connessioni dal container api_backend.
  # Il container MongoDB è presente solo su backend_net (rete interna Docker).
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /certs/mongodb/mongodb-server.pem
    CAFile: /certs/ca/ca.crt
    # Tutti i client devono presentare un certificato firmato dalla CA del progetto.
    allowConnectionsWithoutCertificates: false

security:
  authorization: enabled
