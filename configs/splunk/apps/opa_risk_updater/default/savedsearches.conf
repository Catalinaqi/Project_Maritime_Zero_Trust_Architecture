[Calcolo Dinamico Risk Score OPA]
description = Ricalcola il rischio per utente dagli ultimi decision log OPA
search = index=main sourcetype=opa_decision | rex field=_raw max_match=0 "\\\"user_id\\\":\\\"(?<user_id>[^\\\"]+)" | rex field=_raw max_match=0 "\\\"allowed\\\":(?<allowed>true|false)" | mvexpand user_id | eval denied=if(match(_raw,"\\\"allowed\\\":false"),1,0) | where isnotnull(user_id) AND user_id!="unknown" | stats count as total_requests sum(denied) as denied_count dc(host) as unique_sources latest(_time) as last_seen by user_id | eval isAnomaly=if(denied_count>5 OR unique_sources>3,1,0) | eval risk_score=case(denied_count>10,95, denied_count>5,80, denied_count>2,50, unique_sources>3,40, true(),10) | eval updated_at=now() | table user_id risk_score isAnomaly denied_count unique_sources updated_at | outputlookup historical_risk_scores.csv override_if_empty=false
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
action.opa_risk_updater = 1
action.opa_risk_updater.param.opa_json_path = /opa_data/risk_data/risk_scores.json
