# Calcola ogni minuto il rischio dinamico combinando decision log OPA e alert Snort.
[Calcolo Dinamico Risk Score OPA]
description = Ricalcola il rischio per tutti gli utenti configurati usando gli ultimi decision log OPA e gli alert IDS Snort
search = (index=main sourcetype=opa_decision) OR (index=main sourcetype=snort_alert_json) | eval log_type=case(sourcetype="opa_decision","opa",sourcetype="snort_alert_json","snort") | rex field=_raw max_match=0 "\\\"user_id\\\":\\\"(?<opa_user_id>[^\\\"]+)" | rex field=_raw "\\\"src_ap\\\"\\s*:\\s*\\\"(?<snort_src_ip>[0-9.]+):[0-9]+\\\"" | rex field=_raw "\\\"rule\\\"\\s*:\\s*\\\"(?<snort_rule>[^\\\"]+)\\\"" | rex field=_raw "\\\"msg\\\"\\s*:\\s*\\\"(?<snort_msg>[^\\\"]+)\\\"" | eval src_ip=snort_src_ip | lookup snort_device_mapping.csv src_ip OUTPUT user_id as mapped_user_id device_id as mapped_device_id trust_level | eval user_id=case(log_type="opa" AND isnotnull(opa_user_id),opa_user_id,log_type="snort" AND isnotnull(mapped_user_id),mapped_user_id,log_type="snort","intruso",true(),"unknown") | eval denied=if(log_type="opa" AND match(_raw,"\\\"allowed\\\":false"),1,0) | eval snort_alert=if(log_type="snort",1,0) | eval snort_critical=if(log_type="snort" AND (match(coalesce(snort_msg,""),"CRITICAL|DIRECT|BYPASS|ATTEMPT|INTRUDER|SQL|passwd|cleartext|mTLS") OR match(coalesce(snort_rule,""),"^1:(999902|999903|999904|1000011|1000012|1000018|1000019|1000026):")),1,0) | where isnotnull(user_id) AND user_id!="unknown" | append [ | inputlookup risk_user_baseline.csv | eval log_type="baseline", denied=0, snort_alert=0, snort_critical=0 ] | eval baseline_denied_count=tonumber(baseline_denied_count), baseline_risk_score=tonumber(baseline_risk_score), baseline_is_anomaly=tonumber(baseline_is_anomaly) | stats count(eval(log_type="opa")) as total_requests sum(denied) as recent_denied_count dc(eval(if(log_type="baseline",null(),coalesce(src_ip,host)))) as unique_sources sum(snort_alert) as snort_alert_count sum(snort_critical) as snort_critical_count max(baseline_denied_count) as baseline_denied_count max(baseline_risk_score) as baseline_risk_score max(baseline_is_anomaly) as baseline_is_anomaly latest(snort_rule) as last_snort_rule latest(snort_msg) as last_snort_message latest(mapped_device_id) as device_id latest(trust_level) as trust_level latest(_time) as last_seen by user_id | eval denied_count=recent_denied_count+coalesce(baseline_denied_count,0) | eval dynamic_anomaly=if(denied_count>5 OR unique_sources>3 OR snort_alert_count>5 OR snort_critical_count>0,1,0) | eval isAnomaly=if(dynamic_anomaly=1 OR coalesce(baseline_is_anomaly,0)=1,1,0) | eval dynamic_risk=case(snort_critical_count>0 AND denied_count>5,100, snort_critical_count>0,90, denied_count>10,95, denied_count>5,80, snort_alert_count>5,70, denied_count>2,50, snort_alert_count>0,40, unique_sources>3,40, true(),10) | eval risk_score=if(dynamic_risk<coalesce(baseline_risk_score,10),coalesce(baseline_risk_score,10),dynamic_risk) | eval updated_at=now() | table user_id risk_score isAnomaly denied_count unique_sources snort_alert_count snort_critical_count last_snort_rule last_snort_message device_id trust_level updated_at | outputlookup historical_risk_scores.csv override_if_empty=false
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
action.opa_risk_updater = 1
action.opa_risk_updater.param.opa_json_path = /opa_data/risk_data/risk_scores.json
