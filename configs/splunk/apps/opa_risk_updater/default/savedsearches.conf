[Calcolo Dinamico Risk Score OPA]
description = Analizza i log di Envoy/OPA e ricalcola il risk score con logica statistica
search = index=main sourcetype=opa_decision | rex field=_raw "\"x-user-id\":\"(?<user_id>[^\"]+)\"" | rex field=_raw "\"result\":(?<decision>true|false)" | rex field=_raw "\"source\":{\"address\":{\"socketAddress\":{\"address\":\"(?<src_ip>[^\"]+)\"" | eval is_denied=if(decision="false", 1, 0) | where isnotnull(user_id) AND user_id!="unknown" | stats count as total_requests, sum(is_denied) as denied_count, dc(src_ip) as unique_ips, latest(_time) as last_seen by user_id | eventstats p75(denied_count) as p75_denied, p25(denied_count) as p25_denied, p75(total_requests) as p75_req, p25(total_requests) as p25_req | eval iqr_denied = p75_denied - p25_denied | eval iqr_req = p75_req - p25_req | eval isAnomaly=if((denied_count > (p75_denied + 1.5 * iqr_denied) AND iqr_denied > 0) OR (total_requests > (p75_req + 1.5 * iqr_req) AND iqr_req > 0) OR denied_count > 5, 1, 0) | eval risk_score=case(isAnomaly=1 AND denied_count > 5, 90, isAnomaly=1 AND denied_count > 2, 70, isAnomaly=1, 50, denied_count > 5, 60, denied_count > 2, 40, unique_ips > 3, 30, total_requests > 100, 35, true(), 10) | eval updated_at=now() | table user_id risk_score isAnomaly denied_count unique_ips updated_at | outputlookup historical_risk_scores.csv override_if_empty=false
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
action.opa_risk_updater = 1
action.opa_risk_updater.param.opa_json_path = /opa_data/risk_data/risk_scores.json
