# ============================================
# Maritime - Zero Trust Architecture - Docker Compose
# ============================================

services:
  # ============================================================================
  # LAYER 4: OBSERVABILITY - SIEM
  # ============================================================================

  siem_central:
    image: splunk/splunk:9.1
    container_name: siem_central
    hostname: splunk-siem
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.8
      backend_net:
        ipv4_address: 172.20.3.8
      monitoring_net:
        ipv4_address: 172.20.4.8

    ports:
      - "8000:8000"
      - "8088:8088"

    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
      - ./configs/splunk:/tmp/defaults:ro
      - mongo_audit_logs:/var/log/mongodb
      - ./configs/splunk/apps/opa_risk_updater:/opt/splunk/etc/apps/opa_risk_updater:ro
      - ./configs/opa/data/risk_data:/opa_data
      # snort
      - snort_logs:/var/log/snort:ro

    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_ROLE=splunk_standalone
      - SPLUNK_HOME_OWNERSHIP_ENFORCEMENT=false

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/en-US/account/login"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 4: DATA - MongoDB
  # ============================================================================

  db_primary:
    image: mongo:7.0
    container_name: db_primary
    hostname: mongo-primary
    restart: unless-stopped

    networks:
      backend_net:
        ipv4_address: 172.20.3.5

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./certs/mongodb:/certs/mongodb:ro
      - ./configs/mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./configs/mongodb/init-scripts:/docker-entrypoint-initdb.d:ro
      - mongo_audit_logs:/var/log/mongodb

    command: ["mongod", "--config", "/etc/mongod.conf"]

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--host",
          "db_primary",
          "--tls",
          "--tlsCAFile",
          "/certs/mongodb/ca.crt",
          "--username",
          "${MONGO_ROOT_USER}",
          "--password",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 4: API BACKEND - MongoDB Data Access
  # ============================================================================

  api_backend:
    build:
      context: ./services/api_backend
      dockerfile: Dockerfile
    container_name: api_backend
    hostname: api_backend
    restart: unless-stopped

    networks:
      backend_net:
        ipv4_address: 172.20.3.20

    volumes:
      - ./certs/mongodb/ca.crt:/certs/mongodb/ca.crt:ro

    environment:
      - PORT=3000
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_TLS_CA_FILE=${MONGO_TLS_CA_FILE}

    depends_on:
      db_primary:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 3: DECISION - OPA Policy Engine
  # ============================================================================

  pdp_engine:
    image: openpolicyagent/opa:latest-envoy
    container_name: pdp_engine
    hostname: opa-policy
    restart: unless-stopped
    working_dir: /usr/share/opa-app

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.6
      monitoring_net:
        ipv4_address: 172.20.4.6
      corporate_net:
        ipv4_address: 172.20.10.6
      vpn_net:
        ipv4_address: 172.20.11.6
      satellite_net:
        ipv4_address: 172.20.12.6
      public_net:
        ipv4_address: 172.20.13.6

    ports:
      - "8181:8181"
      - "9191:9191"

    volumes:
      - ./configs/opa/config.yaml:/config/opa-config.yaml:ro
      - ./configs/opa/policies/test-policy.rego:/policies/test-policy.rego:ro
      - ./configs/opa/data/roles.json:/policies/roles.json:ro
      - ./configs/opa/data/devices.json:/policies/devices.json:ro
      - ./configs/opa/data/networks.json:/policies/networks.json:ro
      - ./configs/opa/data/access_rules.json:/policies/access_rules.json:ro
      - ./configs/opa/data/risk_data:/policies/risk_data

    environment:
      - SPLUNK_HEC_URL=https://siem_central:8088/services/collector/event
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - MONGODB_HOST=db_primary
      - MONGODB_PORT=27017

    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--config-file=/config/opa-config.yaml"
      - "--log-level=debug"
      - "--log-format=json"
      - "/policies"

    depends_on:
      siem_central:
        condition: service_started

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 2: ENFORCEMENT - Envoy Proxy PEP
  # ============================================================================

  pep_gateway:
    build:
      context: ./services/envoy
      dockerfile: Dockerfile
    container_name: pep_gateway
    hostname: envoy-gateway
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.7
      backend_net:
        ipv4_address: 172.20.3.7
      corporate_net:
        ipv4_address: 172.20.10.7
      vpn_net:
        ipv4_address: 172.20.11.7
      satellite_net:
        ipv4_address: 172.20.12.7
      public_net:
        ipv4_address: 172.20.13.7

    ports:
      - "8443:8443"
      - "127.0.0.1:9901:9901"

    volumes:
      - ./configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./configs/envoy/mongo_inspector.lua:/etc/envoy/mongo_inspector.lua:ro
      - ./certs/server:/certs:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - envoy_logs:/var/log/envoy

    environment:
      - OPA_HOST=pdp_engine
      - OPA_PORT=9191
      - API_BACKEND_HOST=api_backend
      - API_BACKEND_PORT=3000
      - SPLUNK_HEC_URL=https://siem_central:8088/services/collector/event
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}

    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]

    depends_on:
      pdp_engine:
        condition: service_started
      api_backend:
        condition: service_started

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 1: NETWORK SECURITY - NFTables Firewall
  # ============================================================================

  firewall_perimeter:
    build:
      context: ./services/nftables
      dockerfile: Dockerfile
    container_name: firewall_perimeter
    hostname: nft-firewall
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.10
      backend_net:
        ipv4_address: 172.20.3.10
      monitoring_net:
        ipv4_address: 172.20.4.10
      corporate_net:
        ipv4_address: 172.20.10.10
      vpn_net:
        ipv4_address: 172.20.11.10
      satellite_net:
        ipv4_address: 172.20.12.10
      public_net:
        ipv4_address: 172.20.13.10

    cap_add:
      - NET_ADMIN

    volumes:
      - ./configs/nftables/rules.nft:/etc/nftables/rules.nft:ro
      - nftables_logs:/var/log/nftables

    environment:
      - ENVOY_IP=172.20.2.7
      - MONGODB_IP=172.20.3.5
      - SPLUNK_IP=172.20.4.8
      - OPA_IP=172.20.2.6

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 1: NETWORK SECURITY - Snort IDS
  # ============================================================================

  ids_network_monitor:
    build:
      context: ./services/snort
      dockerfile: Dockerfile # Specifica dove si trova il Dockerfile per costruire l'immagine di Snort.
    container_name: ids_network_monitor # Nome fisso del contenitore per facilitare i comandi nel terminale.
    hostname: snort-ids # Nome della macchina virtuale all'interno del contenitore.
    restart: unless-stopped # Si riavvia sempre in automatico se crasha, a meno che tu non lo fermi manualmente.

    # Translates the $$SNORT_IFACE variable via bash. Pre-creates the alert_json.txt file
    # with open read permissions (chmod 644) for SIEM ingestion, and starts Snort in IDS mode.
    command: /bin/bash -c "touch /var/log/snort/alert_json.txt && chmod 644 /var/log/snort/alert_json.txt && snort -c /etc/snort/snort-mvp.lua -i \"$$SNORT_IFACE\" -l /var/log/snort -u snort -g snort -k none"

    # --- SECURITY & ZERO TRUST ---
    privileged: false # Security Best Practice: Avoid granting full root privileges to the container.
    cap_add:
      - NET_ADMIN # Grant only the privilege to manage network interfaces.
      - NET_RAW   # Required to capture raw network packets in transit.
    security_opt:
      - apparmor:unconfined # Remove AppArmor restrictions to allow Snort deep traffic inspection.

    # --- NETWORKING (The "Black Box") ---
    networks:
      # Connecting Snort to all 7 virtual networks.
      # Linux will assign eth0, eth1, eth2, etc., based on this order.
      zerotrust_net: # Core ZTA processing -> envoy+opa+splunk+snort+nftable
        ipv4_address: 172.20.2.11
      backend_net: # Isolated data storage -> mongoDB+api_backend
        ipv4_address: 172.20.3.11
      monitoring_net: # Security logs & alerts -> splunk+nftables+snort
        ipv4_address: 172.20.4.11
      corporate_net: # Rete aziendale — alta fiducia
        ipv4_address: 172.20.10.11
      vpn_net: # Rete VPN — media fiducia
        ipv4_address: 172.20.11.11
      satellite_net: # Rete satellitare — media fiducia
        ipv4_address: 172.20.12.11
      public_net: # Rete pubblica — bassa fiducia
        ipv4_address: 172.20.13.11

    # --- DATA PERSISTENCE & FILE MAPPING ---
    volumes:
      # Mapping files from your host (PC) to the container as read-only (ro) for security.
      # Updated paths reflecting the new flat structure in the /configs/snort directory.
      - ./configs/snort/snort-mvp.lua:/etc/snort/snort-mvp.lua:ro
      - ./configs/snort/zta-mvp.rules:/etc/snort/zta-mvp.rules:ro
      - snort_logs:/var/log/snort # Save logs in a Docker-managed volume.

    # --- ENVIRONMENT VARIABLES ---
    environment:
      - SNORT_IFACE=${SNORT_IFACE} # Pass the interface.
      - TZ=${TZ} # Synchronize the container's timezone.

    # --- ORCHESTRATION ---
    depends_on:
      siem_central:
        condition: service_started # Wait for Splunk/SIEM to start before launching Snort.

    # --- HEALTH MONITORING (Healthcheck) ---
    healthcheck:
      test: [ "CMD", "pgrep", "snort" ] # Check if the 'snort' process is running.
      interval: 30s # Run the test every 30 seconds.
      timeout: 10s # Fail if no response within 10 seconds.
      retries: 3 # Try 3 times before marking the container as "unhealthy".
      start_period: 60s # Give Snort 60 seconds to load all rules before testing.

    # --- DOCKER LOG MANAGEMENT ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Prevent terminal logs from consuming all disk space (Max 10 MB).
        max-file: "3"   # Keep a maximum of 3 old log files.

  # ============================================================================
  # LAYER 0: DEVICE HARDWARE IDENTITY - SWTPM D-001
  # ============================================================================
  # SWTPM simula un TPM 2.0 per il dispositivo D-001.
  # In produzione questo componente sarebbe sostituito dal TPM fisico del device.

  swtpm_d001:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_d001
    hostname: swtpm-d001
    restart: unless-stopped

    networks:
      vpn_net:
        ipv4_address: 172.20.11.30

    volumes:
      - swtpm_d001_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # TESTING CLIENT TPM - Operatore Ancona con device D-001 TPM-backed
  # ============================================================================
  # Questo client usa SWTPM per custodire la chiave privata del dispositivo.
  # Il certificato device.crt resta un normale certificato X.509,
  # ma la chiave privata non viene usata come file device.key.

  client_operatore_ancona_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_operatore_ancona_tpm
    hostname: client-operatore-ancona-tpm
    restart: "no"

    networks:
      vpn_net:
        ipv4_address: 172.20.11.31

    volumes:
      - ./certs/devices/D-001:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_d001_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - CLIENT_NAME=operatore_ancona
      - CLIENT_ROLE=ruolo_banchina
      - USER_ID=operatore_ancona
      - DEVICE_ID=D-001
      - DEVICE_LOCATION=Terminal-Ancona
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000001
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_d001,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_d001,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_d001:
        condition: service_started
      pep_gateway:
        condition: service_started

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


  # ============================================================================
  # TESTING CLIENTS
  # ============================================================================

  client_operatore_ancona:
    build:
      context: ./services/clients
      dockerfile: Dockerfile
      args:
        CLIENT_TYPE: operatore_ancona
        CLIENT_ROLE: ruolo_banchina
    container_name: client_operatore_ancona
    hostname: client-operatore-ancona
    restart: "no"

    networks:
      vpn_net:
        ipv4_address: 172.20.11.20

    volumes:
      - ./certs/devices/D-001:/certs/device:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./services/clients/scripts:/scripts:ro

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DB_NAME=maritime_zta
      - CLIENT_NAME=operatore_ancona
      - CLIENT_ROLE=ruolo_banchina
      - CLIENT_CERT=/certs/device/device.crt
      - CLIENT_KEY=/certs/device/device.key
      - USER_ID=operatore_ancona
      - CA_CERT=/ca/ca.crt

    depends_on:
      pep_gateway:
        condition: service_started

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_capitano_claudia:
    build:
      context: ./services/clients
      dockerfile: Dockerfile
      args:
        CLIENT_TYPE: capitano_claudia
        CLIENT_ROLE: ruolo_equipaggio
    container_name: client_capitano_claudia
    hostname: client-capitano-claudia
    restart: "no"

    networks:
      satellite_net:
        ipv4_address: 172.20.12.21

    volumes:
      - ./certs/devices/D-002:/certs/device:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./services/clients/scripts:/scripts:ro

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DB_NAME=maritime_zta
      - CLIENT_NAME=capitano_claudia
      - CLIENT_ROLE=ruolo_equipaggio
      - CLIENT_CERT=/certs/device/device.crt
      - CLIENT_KEY=/certs/device/device.key
      - USER_ID=capitano_claudia
      - CA_CERT=/ca/ca.crt

    depends_on:
      pep_gateway:
        condition: service_started

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_soc_admin:
    build:
      context: ./services/clients
      dockerfile: Dockerfile
      args:
        CLIENT_TYPE: soc_admin
        CLIENT_ROLE: ruolo_gestione_flotta
    container_name: client_soc_admin
    hostname: client-soc-admin
    restart: "no"

    networks:
      corporate_net:
        ipv4_address: 172.20.10.20

    volumes:
      - ./certs/devices/D-SOC:/certs/device:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./services/clients/scripts:/scripts:ro

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DB_NAME=maritime_zta
      - CLIENT_NAME=soc_admin
      - CLIENT_ROLE=ruolo_gestione_flotta
      - CLIENT_CERT=/certs/device/device.crt
      - CLIENT_KEY=/certs/device/device.key
      - USER_ID=soc_admin
      - CA_CERT=/ca/ca.crt

    depends_on:
      pep_gateway:
        condition: service_started

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_intruso:
    build:
      context: ./services/clients
      dockerfile: Dockerfile
      args:
        CLIENT_TYPE: intruso
        CLIENT_ROLE: ruolo_non_autorizzato
    container_name: client_intruso
    hostname: client-intruso
    restart: "no"

    networks:
      public_net:
        ipv4_address: 172.20.13.21

    volumes:
      - ./certs/devices/D-001:/certs/device:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./services/clients/scripts:/scripts:ro

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DB_NAME=maritime_zta
      - CLIENT_NAME=intruso
      - CLIENT_ROLE=ruolo_non_autorizzato
      - CLIENT_CERT=/certs/device/device.crt
      - CLIENT_KEY=/certs/device/device.key
      - USER_ID=intruso
      - CA_CERT=/ca/ca.crt

    depends_on:
      pep_gateway:
        condition: service_started

    # --- TRUCO PARA MANTENER EL CONTENEDOR DESPIERTO ---
    tty: true
    stdin_open: true
    command: tail -f /dev/null


    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  corporate_net:
    driver: bridge
    name: maritime-zta_corporate
    ipam:
      config:
        - subnet: 172.20.10.0/24

  vpn_net:
    driver: bridge
    name: maritime-zta_vpn
    ipam:
      config:
        - subnet: 172.20.11.0/24

  satellite_net:
    driver: bridge
    name: maritime-zta_satellite
    ipam:
      config:
        - subnet: 172.20.12.0/24

  public_net:
    driver: bridge
    name: maritime-zta_public
    ipam:
      config:
        - subnet: 172.20.13.0/24

  zerotrust_net:
    driver: bridge
    name: maritime-zta_zerotrust
    ipam:
      config:
        - subnet: ${NETWORK_ZTA_SUBNET:-172.20.2.0/24}

  backend_net:
    driver: bridge
    name: maritime-zta_backend
    internal: true
    ipam:
      config:
        - subnet: ${NETWORK_BACKEND_SUBNET:-172.20.3.0/24}

  monitoring_net:
    driver: bridge
    name: maritime-zta_monitoring
    ipam:
      config:
        - subnet: ${NETWORK_MONITORING_SUBNET:-172.20.4.0/24}

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  mongo_data:
    name: maritime-zta_mongo_data
    driver: local

  mongo_config:
    name: maritime-zta_mongo_config
    driver: local

  mongo_audit_logs:
    name: maritime-zta_mongo_audit_logs
    driver: local

  splunk_data:
    name: maritime-zta_splunk_data
    driver: local

  splunk_etc:
    name: maritime-zta_splunk_etc
    driver: local

  envoy_logs:
    name: maritime-zta_envoy_logs
    driver: local

  nftables_logs:
    name: maritime-zta_nftables_logs
    driver: local

  snort_logs:
    name: maritime-zta_snort_logs
    driver: local

  swtpm_d001_state:
    name: maritime-zta_swtpm_d001_state
    driver: local

  tpm_d001_client_state:
    name: maritime-zta_tpm_d001_client_state
    driver: local
