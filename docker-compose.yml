# ============================================
# Maritime - Zero Trust Architecture - Docker Compose
# ============================================

services:
  # ============================================================================
  # LAYER 4: OBSERVABILITY - SIEM
  # ============================================================================

  siem_central:
    image: splunk/splunk:9.1
    container_name: siem_central
    hostname: splunk-siem
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.8
      backend_net:
        ipv4_address: 172.20.3.8
      monitoring_net:
        ipv4_address: 172.20.4.8

    ports:
      - "8000:8000"
      - "8088:8088"

    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
      - ./configs/splunk:/tmp/defaults:ro
      - mongo_audit_logs:/var/log/mongodb
      - snort_logs:/var/log/snort:ro
      #- ./configs/splunk/apps/opa_risk_updater:/opt/splunk/etc/apps/opa_risk_updater:ro
      - ./configs/opa/data:/opa_data
      - ./configs/splunk/apps/opa_risk_updater:/opt/splunk/etc/apps/opa_risk_updater

      # Splunk attualmente usa il certificato auto-generato `SplunkServerDefaultCert`
      # -> per usare il nostro certificato CA è necessario implementare
      # -> modificando i file: `inputs.conf`, `server.conf`
      # -> e aggiungendo nella sezione dei volumi:
      # `./certs/ca/ca.crt:/ca/ca.crt:ro`

    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
     # - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_ROLE=splunk_standalone
      - SPLUNK_HOME_OWNERSHIP_ENFORCEMENT=false
      - SPLUNK_DISABLE_POPUPS=true
      - SPLUNK_HOME_OWNERSHIP_ENFORCEMENT=true
      - SPLUNK_USER=root

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/en-US/account/login"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 4: DATA - MongoDB
  # ============================================================================

  db_primary:
    image: mongo:7.0
    container_name: db_primary
    hostname: mongo-primary
    restart: unless-stopped

    networks:
      backend_net:
        ipv4_address: 172.20.3.5

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./certs/mongodb:/certs/mongodb:ro
      - ./configs/mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./configs/mongodb/init-scripts:/docker-entrypoint-initdb.d:ro
      - mongo_audit_logs:/var/log/mongodb

    command: ["mongod", "--config", "/etc/mongod.conf"]

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--host",
          "172.20.3.5", # "db_primary",
          "--tls",
          "--tlsCAFile",
          "/certs/mongodb/ca.crt",
          "--username",
          "${MONGO_ROOT_USER}",
          "--password",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 4: API BACKEND - MongoDB Data Access
  # ============================================================================

  api_backend:
    build:
      context: ./services/api_backend
      dockerfile: Dockerfile
    container_name: api_backend
    hostname: api_backend
    restart: unless-stopped

    networks:
      backend_net:
        ipv4_address: 172.20.3.20

    volumes:
      - ./certs/mongodb/ca.crt:/certs/mongodb/ca.crt:ro

    environment:
      - PORT=3000
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_TLS_CA_FILE=${MONGO_TLS_CA_FILE}

    depends_on:
      db_primary:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.get('http://127.0.0.1:3000/health',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1)});"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ============================================================================
  # LAYER 2: POLICY DECISION POINT - OPEN POLICY AGENT
  # ============================================================================

  pdp_engine:
    # Immagine OPA contenente il plugin Envoy External Authorization.
    image: openpolicyagent/opa:latest-envoy

    # Nome assegnato al container.
    container_name: pdp_engine

    # Nome host interno.
    hostname: opa-policy

    # Riavvia OPA automaticamente.
    restart: unless-stopped

    # Directory di lavoro interna.
    working_dir: /usr/share/opa-app

    networks:
      # Rete attraverso la quale Envoy comunica con OPA.
      zerotrust_net:
        ipv4_address: 172.20.2.6

      # Rete utilizzata da OPA per inviare i decision log a Splunk.
      monitoring_net:
        ipv4_address: 172.20.4.6

    # La porta REST è pubblicata esclusivamente sull'interfaccia locale
    # del computer, per consentire i test amministrativi.
    #
    # Non è raggiungibile dagli altri computer della rete locale.
    ports:
      - "127.0.0.1:8181:8181"

    # Documenta le porte utilizzate internamente.
    #
    # 8181: REST API di OPA.
    # 9191: servizio gRPC ext_authz utilizzato da Envoy.
    expose:
      - "8181"
      - "9191"

    volumes:
      # Configurazione principale di OPA.
      - ./configs/opa/config.yaml:/config/opa-config.yaml:ro

      # Policy Rego utilizzata per le decisioni.
      - ./configs/opa/policies/test-policy.rego:/policies/test-policy.rego:ro

      # Dati relativi ai ruoli.
      - ./configs/opa/data/roles.json:/policies/roles.json:ro

      # Dati relativi ai dispositivi.
      - ./configs/opa/data/devices.json:/policies/devices.json:ro

      # Dati relativi alle reti.
      - ./configs/opa/data/networks.json:/policies/networks.json:ro

      # Regole di associazione utente, dispositivo e rete.
      - ./configs/opa/data/access_rules.json:/policies/access_rules.json:ro

      # Directory contenente i risk score aggiornati da Splunk.
      #
      # Non è impostata come sola lettura perché il file viene aggiornato
      # dal sistema di gestione dinamica del rischio.
      - ./configs/opa/data/risk_data:/policies/risk_data

    environment:
      # Indirizzo di Splunk HEC.
      #
      # La configurazione effettiva dei decision log è definita anche
      # nel file configs/opa/config.yaml.
      - SPLUNK_HEC_URL=http://siem_central:8088/services/collector/event

      # Token HEC definito nel file .env.
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}

      # Parametri MongoDB mantenuti per compatibilità con gli script
      # e le configurazioni esistenti.
      - MONGODB_HOST=db_primary
      - MONGODB_PORT=27017

    command:
      # Avvia OPA in modalità server.
      - run

      # Abilita il server REST.
      - --server

      # Espone la REST API su tutte le interfacce interne del container.
      - --addr=0.0.0.0:8181

      # Carica la configurazione del plugin Envoy e dei decision log.
      - --config-file=/config/opa-config.yaml

      # Livello di log utile per la fase di sviluppo e verifica.
      - --log-level=debug

      # Formato strutturato dei log.
      - --log-format=json

      # Ricarica automaticamente policy e dati modificati.
      - --watch

      # Directory contenente policy e dati.
      - /policies

    depends_on:
      # Splunk deve essere disponibile per ricevere i decision log.
      siem_central:
        condition: service_healthy

    healthcheck:
      # Verifica che il motore OPA sia in grado di valutare un'espressione.
      test:
        - CMD
        - /opa
        - eval
        - "1"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ============================================================================
  # LAYER 2: ENFORCEMENT - Envoy Proxy PEP
  # ============================================================================

  pep_gateway:
    # Costruisce l'immagine Envoy con lo script per le route di ritorno.
    build:
      context: ./services/envoy
      dockerfile: Dockerfile

    container_name: pep_gateway
    hostname: envoy-gateway
    restart: unless-stopped

    # Envoy deve poter aggiungere le route verso le reti dei client.
    cap_add:
      - NET_ADMIN

    networks:
      # Rete condivisa con OPA e firewall.
      zerotrust_net:
        ipv4_address: 172.20.2.7

      # Rete condivisa con il backend API.
      backend_net:
        ipv4_address: 172.20.3.7

    volumes:
      # Configurazione principale di Envoy.
      - ./configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

      # Filtro Lua che prepara i metadati per OPA.
      - ./configs/envoy/mongo_inspector.lua:/etc/envoy/mongo_inspector.lua:ro

      # Certificato e chiave TLS del server Envoy.
      - ./certs/server:/certs:ro

      # Certificato pubblico della CA.
      - ./certs/ca/ca.crt:/ca/ca.crt:ro

      # Log persistenti di Envoy.
      - envoy_logs:/var/log/envoy

    environment:
      # Indirizzo del firewall nella rete Zero Trust.
      - FIREWALL_ZEROTRUST_IP=172.20.2.10

      # Sottoreti verso le quali Envoy deve rispondere passando dal firewall.
      - NETWORK_CORPORATE_SUBNET=${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      - NETWORK_VPN_SUBNET=${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      - NETWORK_SATELLITE_SUBNET=${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      - NETWORK_PUBLIC_SUBNET=${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}

      # Collegamento a OPA.
      - OPA_HOST=pdp_engine
      - OPA_PORT=9191

      # Collegamento al backend.
      - API_BACKEND_HOST=api_backend
      - API_BACKEND_PORT=3000

      # Collegamento a Splunk.
      - SPLUNK_HEC_URL=http://siem_central:8088/services/collector/event
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}

    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info

    depends_on:
      # Il firewall deve esistere prima che Envoy aggiunga le route.
      firewall_perimeter:
        condition: service_started

      # OPA deve essere disponibile.
      pdp_engine:
        condition: service_healthy

      # Il backend deve essere disponibile.
      api_backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9901/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ============================================================================
  # LAYER 1: NETWORK SECURITY - NFTables Firewall
  # ============================================================================

  firewall_perimeter:
    build:
      context: ./services/nftables
      dockerfile: Dockerfile

    container_name: firewall_perimeter
    hostname: nft-firewall
    restart: unless-stopped

    # Il firewall collega le reti dei client con la rete Zero Trust.
    networks:
      # Rete tra firewall, Envoy e OPA.
      zerotrust_net:
        ipv4_address: 172.20.2.10
        interface_name: zt0

      # Rete interna di API e MongoDB.
      backend_net:
        ipv4_address: 172.20.3.10
        interface_name: backend0

      # Rete di monitoraggio e Splunk.
      monitoring_net:
        ipv4_address: 172.20.4.10
        interface_name: monitor0

      # Rete corporate.
      corporate_net:
        ipv4_address: 172.20.10.10
        interface_name: corp0
        aliases:
          - pep_gateway

      # Rete VPN.
      vpn_net:
        ipv4_address: 172.20.11.10
        interface_name: vpn0
        aliases:
          - pep_gateway

      # Rete satellitare.
      satellite_net:
        ipv4_address: 172.20.12.10
        interface_name: sat0
        aliases:
          - pep_gateway

      # Rete pubblica.
      public_net:
        ipv4_address: 172.20.13.10
        interface_name: public0
        aliases:
          - pep_gateway

    # Permette di caricare le regole NFTables.
    cap_add:
      - NET_ADMIN

    # Abilita il routing tra le reti.
    sysctls:
      net.ipv4.ip_forward: "1"

    volumes:
      # Regole definitive del firewall.
      - ./configs/nftables/rules.nft:/etc/nftables/rules.nft:ro

    environment:
      # Envoy reale nella rete Zero Trust.
      - NFTABLES_ENVOY_IP=172.20.2.7

      # Indirizzi del firewall sulle quattro reti client.
      - NFTABLES_FW_CORPORATE_IP=172.20.10.10
      - NFTABLES_FW_VPN_IP=172.20.11.10
      - NFTABLES_FW_SATELLITE_IP=172.20.12.10
      - NFTABLES_FW_PUBLIC_IP=172.20.13.10

      # Sottoreti dei client.
      - NFTABLES_CORPORATE_NET=${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      - NFTABLES_VPN_NET=${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      - NFTABLES_SATELLITE_NET=${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      - NFTABLES_PUBLIC_NET=${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}

      # Porta mTLS di Envoy.
      - NFTABLES_PEP_PORT=${NFTABLES_PEP_PORT:-8443}

      # Configurazione Splunk per i log NFTables.
      - NFTABLES_SPLUNK_HEC_URL=http://siem_central:8088/services/collector/event
      - NFTABLES_SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}

    healthcheck:
      # La tabella utilizzata è "ip filter", non "inet filter".
      test:
        [
          "CMD-SHELL",
          "nft list table ip filter >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

   # ============================================================================
  # LAYER 1: NETWORK SECURITY - SNORT IDS PASSIVO
  # ============================================================================

  ids_network_monitor:
    # Costruisce Snort utilizzando il Dockerfile presente in services/snort.
    build:
      context: ./services/snort
      dockerfile: Dockerfile

    # Nome assegnato al container.
    container_name: ids_network_monitor

    # Riavvia il sensore automaticamente in caso di arresto.
    restart: unless-stopped

    # Snort condivide il namespace di rete del firewall.
    #
    # Non possiede propri indirizzi IP e non riceve connessioni.
    # Osserva invece le interfacce attraverso le quali il firewall
    # inoltra il traffico verso Envoy.
    network_mode: "service:firewall_perimeter"

    # Capacità necessarie per catturare i pacchetti.
    cap_add:
      - NET_RAW
      - NET_ADMIN

    # Evita che AppArmor impedisca la cattura dei pacchetti.
    security_opt:
      - apparmor:unconfined

    volumes:
      # Configurazione principale di Snort.
      - ./configs/snort/snort-zta.lua:/etc/snort/snort-zta.lua:ro

      # Regole personalizzate del progetto.
      - ./configs/snort/snort-zta.rules:/etc/snort/snort-zta.rules:ro

      # Script di avvio di Snort.
      - ./services/snort/entrypoint.sh:/scripts/entrypoint.sh:ro

      # Volume condiviso contenente gli alert letti da Splunk.
      - snort_logs:/var/log/snort

    environment:
      # Fuso orario.
      - TZ=${TZ}

      # Snort osserva tutte le interfacce del namespace del firewall.
      - ZTA_SNORT_INTERFACES=corp0:vpn0:sat0:public0

      # Insieme delle reti appartenenti all'architettura.
      - ZTA_HOME_NET=[172.20.2.0/24,172.20.3.0/24,172.20.4.0/24,172.20.10.0/24,172.20.11.0/24,172.20.12.0/24,172.20.13.0/24]

      # Singole reti utilizzate dalle regole.
      - ZTA_PUBLIC_NET=${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}
      - ZTA_VPN_NET=${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      - ZTA_SATELLITE_NET=${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      - ZTA_CORPORATE_NET=${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      - ZTA_BACKEND_NET=${NETWORK_BACKEND_SUBNET:-172.20.3.0/24}

      # Porte monitorate.
      - ZTA_PEP_PORT=${SNORT_PORT_PEP:-8443}
      - ZTA_OPA_PORTS=${SNORT_PORT_OPA:-[8181,9191]}
      - ZTA_MONGO_PORT=${SNORT_PORT_MONGO:-27017}
      - ZTA_API_PORT=${SNORT_PORT_API:-3000}
      - ZTA_SIEM_PORTS=${SNORT_PORT_SIEM:-[8000,8088]}
      - ZTA_ADMIN_PORT=${SNORT_PORT_ADMIN:-9901}

    depends_on:
      # Snort può condividere la rete del firewall solamente quando
      # il firewall è completamente avviato e le regole sono state caricate.
      firewall_perimeter:
        condition: service_healthy

      # Splunk deve essere disponibile per raccogliere gli alert.
      siem_central:
        condition: service_healthy

    healthcheck:
      # Il container è sano quando il processo Snort è attivo.
      test:
        - CMD
        - pgrep
        - snort
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 0: DEVICE HARDWARE IDENTITY - SWTPM
  # ============================================================================
  # Ogni container SWTPM rappresenta il TPM emulato di un dispositivo.
  # Il TPM appartiene al device, non all'utente.

  swtpm_d001:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_d001
    hostname: swtpm-d001
    restart: unless-stopped

    networks:
      vpn_net:
        ipv4_address: 172.20.11.30

    volumes:
      - swtpm_d001_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  swtpm_d002:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_d002
    hostname: swtpm-d002
    restart: unless-stopped

    networks:
      satellite_net:
        ipv4_address: 172.20.12.30

    volumes:
      - swtpm_d002_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  swtpm_dsoc:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_dsoc
    hostname: swtpm-dsoc
    restart: unless-stopped

    networks:
      corporate_net:
        ipv4_address: 172.20.10.30

    volumes:
      - swtpm_dsoc_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # TESTING CLIENTS TPM-BACKED
  # ============================================================================
  # Questi container rappresentano dispositivi con TPM.
  # L'utente applicativo viene passato con USER_ID e può cambiare nei test.

  client_d001_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_d001_tpm
    hostname: client-d001-tpm
    restart: "no"

    networks:
      vpn_net:
        ipv4_address: 172.20.11.31

    volumes:
      - ./certs/devices/D-001:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_d001_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DEVICE_ID=D-001
      - DEVICE_LOCATION=Terminal-Ancona
      - USER_ID=operatore_ancona
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000001
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_d001,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_d001,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_d001:
        condition: service_started
      pep_gateway:
        condition: service_started

    command: ["tail", "-f", "/dev/null"]
    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_d002_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_d002_tpm
    hostname: client-d002-tpm
    restart: "no"

    networks:
      satellite_net:
        ipv4_address: 172.20.12.31

    volumes:
      - ./certs/devices/D-002:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_d002_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DEVICE_ID=D-002
      - DEVICE_LOCATION=Ponte-Comando
      - USER_ID=capitano_claudia
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000002
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_d002,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_d002,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_d002:
        condition: service_started
      pep_gateway:
        condition: service_started

    command: ["tail", "-f", "/dev/null"]
    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_dsoc_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_dsoc_tpm
    hostname: client-dsoc-tpm
    restart: "no"

    networks:
      corporate_net:
        ipv4_address: 172.20.10.31

    volumes:
      - ./certs/devices/D-SOC:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_dsoc_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DEVICE_ID=D-SOC
      - DEVICE_LOCATION=SOC-Center
      - USER_ID=soc_admin
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000003
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_dsoc,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_dsoc,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_dsoc:
        condition: service_started
      pep_gateway:
        condition: service_started

    command: ["tail", "-f", "/dev/null"]
    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

