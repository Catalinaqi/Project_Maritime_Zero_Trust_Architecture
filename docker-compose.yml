# Maritime Zero Trust Architecture
# File Compose autorevole del progetto. Le reti client raggiungono Envoy
# esclusivamente attraverso il firewall perimetrale.
name: maritime-zta

services:
  # SIEM centrale e ricevitore HEC.

  siem_central:
    image: splunk/splunk:9.1
    container_name: siem_central
    hostname: splunk-siem
    restart: unless-stopped
    networks:
      monitoring_net:
        ipv4_address: 172.20.4.8
    ports:
      - "127.0.0.1:${SPLUNK_WEB_PORT:-8000}:8000"
      - "127.0.0.1:${SPLUNK_HEC_PORT:-8088}:8088"
    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
      - ./configs/splunk/default.yml:/tmp/defaults/default.yml:ro
      - ./configs/splunk/apps/opa_risk_updater:/opt/splunk/etc/apps/opa_risk_updater
      - ./configs/opa/data/risk_data:/opa_data/risk_data
      - snort_logs:/var/log/snort:ro
      - mongo_logs:/var/log/mongodb:ro
      - envoy_logs:/var/log/envoy:ro
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Definire SPLUNK_PASSWORD nel file .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Definire SPLUNK_HEC_TOKEN nel file .env}
      SPLUNK_ROLE: splunk_standalone
      SPLUNK_HOME_OWNERSHIP_ENFORCEMENT: "false"
      SPLUNK_DISABLE_POPUPS: "true"
      SPLUNK_USER: root
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/en-US/account/login"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 240s
    logging: &default_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db_primary:
    image: mongo:7.0
    container_name: db_primary
    hostname: mongo-primary
    restart: unless-stopped
    networks:
      backend_net:
        ipv4_address: 172.20.3.5
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./certs/mongodb:/certs/mongodb:ro
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./configs/mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./configs/mongodb/init-scripts:/docker-entrypoint-initdb.d:ro
      - mongo_logs:/var/log/mongodb
    command: ["mongod", "--config", "/etc/mongod.conf"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Definire MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Definire MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-maritime_zta}
      MONGO_DATABASE: ${MONGO_DATABASE:-maritime_zta}
      MONGO_APP_USER: ${MONGO_APP_USER:?Definire MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Definire MONGO_APP_PASSWORD}
    healthcheck:
      test:
        - CMD
        - mongosh
        - --host
        - db_primary
        - --tls
        - --tlsCAFile
        - /certs/ca/ca.crt
        - --tlsCertificateKeyFile
        - /certs/mongodb/healthcheck-client.pem
        - --username
        - ${MONGO_ROOT_USER}
        - --password
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --quiet
        - --eval
        - db.adminCommand('ping')
      interval: 10s
      timeout: 8s
      retries: 8
      start_period: 45s
    logging: *default_logging

  api_backend:
    build:
      context: ./services/api_backend
      dockerfile: Dockerfile
    container_name: api_backend
    hostname: api-backend
    restart: unless-stopped
    networks:
      backend_net:
        ipv4_address: 172.20.3.20
    volumes:
      - ./certs/ca/ca.crt:/certs/ca/ca.crt:ro
      - ./certs/mongodb/api-client.pem:/certs/mongodb/api-client.pem:ro
    environment:
      PORT: ${API_PORT:-3000}
      MONGO_HOST: ${MONGO_HOST:-db_primary}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-maritime_zta}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_AUTH_DB: ${MONGO_APP_AUTH_DB:-maritime_zta}
      MONGO_TLS_CA_FILE: /certs/ca/ca.crt
      MONGO_TLS_CERT_KEY_FILE: /certs/mongodb/api-client.pem
    depends_on:
      db_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1));h.on('error',()=>process.exit(1));h.setTimeout(5000,()=>{h.destroy();process.exit(1)});"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging: *default_logging

  pdp_engine:
    image: openpolicyagent/opa:1.17.1-envoy
    container_name: pdp_engine
    hostname: opa-policy
    restart: unless-stopped
    working_dir: /usr/share/opa-app
    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.6
      monitoring_net:
        ipv4_address: 172.20.4.6
    ports:
      - "127.0.0.1:${OPA_REST_PORT:-8181}:8181"
    expose: ["8181", "9191"]
    volumes:
      - ./configs/opa/config.yaml:/config/opa-config.yaml:ro
      - ./configs/opa/policies/authorization.rego:/policies/authorization.rego:ro
      - ./configs/opa/data/roles.json:/policies/roles.json:ro
      - ./configs/opa/data/devices.json:/policies/devices.json:ro
      - ./configs/opa/data/networks.json:/policies/networks.json:ro
      - ./configs/opa/data/access_rules.json:/policies/access_rules.json:ro
      - ./configs/opa/data/risk_data:/policies/risk_data
    environment:
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --config-file=/config/opa-config.yaml
      - --log-level=info
      - --log-format=json
      - --watch
      - /policies
    # OPA può avviarsi anche se Splunk non è ancora pronto; il logger ritenta
    # senza rendere il piano decisionale dipendente dal SIEM.
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default_logging

  firewall_perimeter:
    build:
      context: ./services/nftables
      dockerfile: Dockerfile
    container_name: firewall_perimeter
    hostname: nft-firewall
    restart: unless-stopped
    # Logic migrated to the entry point - Docker Compose does not support it.
    # 1-> interface_name: zt0 -> 172.20.2.10
    # 2-> interface_name: monitor0 -> 172.20.4.10
    # 3-> interface_name: corp0 -> 172.20.10.10
    # 4-> interface_name: vpn0 -> 172.20.11.10
    # 5-> interface_name: public0 -> 172.20.12.10
    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.10
      monitoring_net:
        ipv4_address: 172.20.4.10
      corporate_net:
        ipv4_address: 172.20.10.10
        aliases: [pep_gateway]
      vpn_net:
        ipv4_address: 172.20.11.10
        aliases: [pep_gateway]
      satellite_net:
        ipv4_address: 172.20.12.10
        aliases: [pep_gateway]
      public_net:
        ipv4_address: 172.20.13.10
        aliases: [pep_gateway]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./configs/nftables/rules.nft:/etc/nftables/rules.nft:ro
      - nftables_logs:/var/log/nftables
    environment:
      NFTABLES_ENVOY_IP: 172.20.2.7
      NFTABLES_FW_CORPORATE_IP: 172.20.10.10
      NFTABLES_FW_VPN_IP: 172.20.11.10
      NFTABLES_FW_SATELLITE_IP: 172.20.12.10
      NFTABLES_FW_PUBLIC_IP: 172.20.13.10
      NFTABLES_CORPORATE_NET: ${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      NFTABLES_VPN_NET: ${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      NFTABLES_SATELLITE_NET: ${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      NFTABLES_PUBLIC_NET: ${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}
      NFTABLES_PEP_PORT: ${ENVOY_LISTENER_PORT:-8443}
      NFTABLES_SPLUNK_HEC_URL: http://siem_central:8088/services/collector/event
      NFTABLES_SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "nft list table ip filter >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default_logging

  pep_gateway:
    build:
      context: ./services/envoy
      dockerfile: Dockerfile
    container_name: pep_gateway
    hostname: envoy-gateway
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.7
      backend_net:
        ipv4_address: 172.20.3.7
    volumes:
      - ./configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./configs/envoy/mongo_inspector.lua:/etc/envoy/mongo_inspector.lua:ro
      - ./certs/server:/certs:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - envoy_logs:/var/log/envoy
    environment:
      FIREWALL_ZEROTRUST_IP: 172.20.2.10
      NETWORK_CORPORATE_SUBNET: ${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      NETWORK_VPN_SUBNET: ${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      NETWORK_SATELLITE_SUBNET: ${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      NETWORK_PUBLIC_SUBNET: ${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}
    depends_on:
      firewall_perimeter:
        condition: service_healthy
      pdp_engine:
        condition: service_healthy
      api_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9901/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default_logging

  ids_network_monitor:
    build:
      context: ./services/snort
      dockerfile: Dockerfile
    container_name: ids_network_monitor
    restart: unless-stopped
    network_mode: service:firewall_perimeter
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: [apparmor:unconfined]
    volumes:
      - ./configs/snort/snort-zta.lua:/etc/snort/snort-zta.lua:ro
      - ./configs/snort/snort-zta.rules:/etc/snort/snort-zta.rules:ro
      - snort_logs:/var/log/snort
    environment:
      TZ: ${TZ:-Europe/Rome}
      ZTA_SNORT_INTERFACES: corp0:vpn0:sat0:public0
      ZTA_HOME_NET: "[172.20.2.0/24,172.20.3.0/24,172.20.4.0/24,172.20.10.0/24,172.20.11.0/24,172.20.12.0/24,172.20.13.0/24]"
      ZTA_PUBLIC_NET: ${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}
      ZTA_VPN_NET: ${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      ZTA_SATELLITE_NET: ${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      ZTA_CORPORATE_NET: ${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      ZTA_BACKEND_NET: ${NETWORK_BACKEND_SUBNET:-172.20.3.0/24}
      ZTA_PEP_PORT: ${ENVOY_LISTENER_PORT:-8443}
      ZTA_OPA_PORTS: "[8181,9191]"
      ZTA_MONGO_PORT: ${MONGO_PORT_INTERNAL:-27017}
      ZTA_API_PORT: ${API_PORT:-3000}
      ZTA_SIEM_PORTS: "[8000,8088]"
      ZTA_ADMIN_PORT: ${ENVOY_ADMIN_PORT:-9901}
    depends_on:
      firewall_perimeter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "snort"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default_logging

  swtpm_d001: &swtpm_template
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_d001
    hostname: swtpm-d001
    restart: unless-stopped
    networks:
      vpn_net:
        ipv4_address: 172.20.11.30
    volumes:
      - swtpm_d001_state:/var/lib/swtpm
    environment:
      TPM_STATE_DIR: /var/lib/swtpm
      TPM_SERVER_PORT: 2321
      TPM_CTRL_PORT: 2322
    profiles: [testing]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2321"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default_logging

  swtpm_d002:
    <<: *swtpm_template
    container_name: swtpm_d002
    hostname: swtpm-d002
    networks:
      satellite_net:
        ipv4_address: 172.20.12.30
    volumes:
      - swtpm_d002_state:/var/lib/swtpm

  swtpm_dsoc:
    <<: *swtpm_template
    container_name: swtpm_dsoc
    hostname: swtpm-dsoc
    networks:
      corporate_net:
        ipv4_address: 172.20.10.30
    volumes:
      - swtpm_dsoc_state:/var/lib/swtpm

  client_d001_tpm: &client_tpm_template
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_d001_tpm
    hostname: client-d001-tpm
    restart: "no"
    networks:
      vpn_net:
        ipv4_address: 172.20.11.31
    volumes:
      - ./certs/devices/D-001:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - tpm_d001_client_state:/tpm
    environment:
      ENVOY_HOST: pep_gateway
      ENVOY_PORT: 8443
      USER_ID: operatore_ancona
      DEVICE_ID: D-001
      CLIENT_CERT: /certs/device/device.crt
      CA_CERT: /ca/ca.crt
      TPM_HANDLE: "0x81000001"
      TPM2TOOLS_TCTI: swtpm:host=swtpm_d001,port=2321
      TPM2OPENSSL_TCTI: swtpm:host=swtpm_d001,port=2321
      OPENSSL_MODULES: /usr/local/lib/ossl-modules
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      swtpm_d001:
        condition: service_healthy
    profiles: [testing]
    logging: *default_logging

  client_d002_tpm:
    <<: *client_tpm_template
    container_name: client_d002_tpm
    hostname: client-d002-tpm
    networks:
      satellite_net:
        ipv4_address: 172.20.12.31
    volumes:
      - ./certs/devices/D-002:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - tpm_d002_client_state:/tpm
    environment:
      ENVOY_HOST: pep_gateway
      ENVOY_PORT: 8443
      USER_ID: capitano_claudia
      DEVICE_ID: D-002
      CLIENT_CERT: /certs/device/device.crt
      CA_CERT: /ca/ca.crt
      TPM_HANDLE: "0x81000002"
      TPM2TOOLS_TCTI: swtpm:host=swtpm_d002,port=2321
      TPM2OPENSSL_TCTI: swtpm:host=swtpm_d002,port=2321
      OPENSSL_MODULES: /usr/local/lib/ossl-modules
    depends_on:
      swtpm_d002:
        condition: service_healthy

  client_dsoc_tpm:
    <<: *client_tpm_template
    container_name: client_dsoc_tpm
    hostname: client-dsoc-tpm
    networks:
      corporate_net:
        ipv4_address: 172.20.10.31
    volumes:
      - ./certs/devices/D-SOC:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - tpm_dsoc_client_state:/tpm
    environment:
      ENVOY_HOST: pep_gateway
      ENVOY_PORT: 8443
      USER_ID: soc_admin
      DEVICE_ID: D-SOC
      CLIENT_CERT: /certs/device/device.crt
      CA_CERT: /ca/ca.crt
      TPM_HANDLE: "0x81000003"
      TPM2TOOLS_TCTI: swtpm:host=swtpm_dsoc,port=2321
      TPM2OPENSSL_TCTI: swtpm:host=swtpm_dsoc,port=2321
      OPENSSL_MODULES: /usr/local/lib/ossl-modules
    depends_on:
      swtpm_dsoc:
        condition: service_healthy

# Segmentazione: backend e monitoring sono reti Docker interne.
networks:
  corporate_net:
    driver: bridge
    name: maritime-zta_corporate
    ipam: {config: [{subnet: "${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}"}]}
  vpn_net:
    driver: bridge
    name: maritime-zta_vpn
    ipam: {config: [{subnet: "${NETWORK_VPN_SUBNET:-172.20.11.0/24}"}]}
  satellite_net:
    driver: bridge
    name: maritime-zta_satellite
    ipam: {config: [{subnet: "${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}"}]}
  public_net:
    driver: bridge
    name: maritime-zta_public
    ipam: {config: [{subnet: "${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}"}]}
  zerotrust_net:
    driver: bridge
    name: maritime-zta_zerotrust
    ipam: {config: [{subnet: "${NETWORK_ZTA_SUBNET:-172.20.2.0/24}"}]}
  backend_net:
    driver: bridge
    name: maritime-zta_backend
    internal: true
    ipam: {config: [{subnet: "${NETWORK_BACKEND_SUBNET:-172.20.3.0/24}"}]}
  monitoring_net:
    driver: bridge
    name: maritime-zta_monitoring
    internal: true
    ipam: {config: [{subnet: "${NETWORK_MONITORING_SUBNET:-172.20.4.0/24}"}]}

volumes:
  mongo_data: {name: maritime-zta_mongo_data}
  mongo_config: {name: maritime-zta_mongo_config}
  mongo_logs: {name: maritime-zta_mongo_logs}
  envoy_logs: {name: maritime-zta_envoy_logs}
  splunk_data: {name: maritime-zta_splunk_data}
  splunk_etc: {name: maritime-zta_splunk_etc}
  snort_logs: {name: maritime-zta_snort_logs}
  nftables_logs: {name: maritime-zta_nftables_logs}
  swtpm_d001_state: {name: maritime-zta_swtpm_d001_state}
  swtpm_d002_state: {name: maritime-zta_swtpm_d002_state}
  swtpm_dsoc_state: {name: maritime-zta_swtpm_dsoc_state}
  tpm_d001_client_state: {name: maritime-zta_tpm_d001_client_state}
  tpm_d002_client_state: {name: maritime-zta_tpm_d002_client_state}
  tpm_dsoc_client_state: {name: maritime-zta_tpm_dsoc_client_state}
