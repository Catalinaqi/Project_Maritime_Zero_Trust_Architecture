# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  corporate_net:
    driver: bridge
    name: maritime-zta_corporate
    ipam:
      config:
        - subnet: ${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}

  vpn_net:
    driver: bridge
    name: maritime-zta_vpn
    ipam:
      config:
        - subnet: ${NETWORK_VPN_SUBNET:-172.20.11.0/24}

  satellite_net:
    driver: bridge
    name: maritime-zta_satellite
    ipam:
      config:
        - subnet: ${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}

  public_net:
    driver: bridge
    name: maritime-zta_public
    ipam:
      config:
        - subnet: ${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}

  zerotrust_net:
    driver: bridge
    name: maritime-zta_zerotrust
    ipam:
      config:
        - subnet: ${NETWORK_ZTA_SUBNET:-172.20.2.0/24}

  backend_net:
    driver: bridge
    name: maritime-zta_backend
    internal: true
    ipam:
      config:
        - subnet: ${NETWORK_BACKEND_SUBNET:-172.20.3.0/24}

  monitoring_net:
    driver: bridge
    name: maritime-zta_monitoring
    ipam:
      config:
        - subnet: ${NETWORK_MONITORING_SUBNET:-172.20.4.0/24}

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  mongo_data:
    name: maritime-zta_mongo_data
    driver: local

  mongo_config:
    name: maritime-zta_mongo_config
    driver: local

  mongo_audit_logs:
    name: maritime-zta_mongo_audit_logs
    driver: local

  splunk_data:
    name: maritime-zta_splunk_data
    driver: local

  splunk_etc:
    name: maritime-zta_splunk_etc
    driver: local

  envoy_logs:
    name: maritime-zta_envoy_logs
    driver: local

#  nftables_logs:
#    name: maritime-zta_nftables_logs
#    driver: local

  snort_logs:
    name: maritime-zta_snort_logs
    driver: local

  swtpm_d001_state:
    name: maritime-zta_swtpm_d001_state
    driver: local

  swtpm_d002_state:
    name: maritime-zta_swtpm_d002_state
    driver: local

  swtpm_dsoc_state:
    name: maritime-zta_swtpm_dsoc_state
    driver: local

  tpm_d001_client_state:
    name: maritime-zta_tpm_d001_client_state
    driver: local

  tpm_d002_client_state:
    name: maritime-zta_tpm_d002_client_state
    driver: local

  tpm_dsoc_client_state:
    name: maritime-zta_tpm_dsoc_client_state
    driver: local




