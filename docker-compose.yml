# ============================================
# Maritime - Zero Trust Architecture - Docker Compose
# ============================================

services:
  # ============================================================================
  # LAYER 4: OBSERVABILITY - SIEM
  # ============================================================================

  siem_central:
    image: splunk/splunk:9.1
    container_name: siem_central
    hostname: splunk-siem
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.8
      backend_net:
        ipv4_address: 172.20.3.8
      monitoring_net:
        ipv4_address: 172.20.4.8

    ports:
      - "8000:8000"
      - "8088:8088"

    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
      - ./configs/splunk:/tmp/defaults:ro
      - mongo_audit_logs:/var/log/mongodb
      - snort_logs:/var/log/snort:ro
      #- ./configs/splunk/apps/opa_risk_updater:/opt/splunk/etc/apps/opa_risk_updater:ro
      - ./configs/opa/data:/opa_data
      - ./configs/splunk/apps/opa_risk_updater:/opt/splunk/etc/apps/opa_risk_updater
      - ./configs/opa/data/risk_data:/opa_data

      # Splunk attualmente usa il certificato auto-generato `SplunkServerDefaultCert`
      # -> per usare il nostro certificato CA è necessario implementare
      # -> modificando i file: `inputs.conf`, `server.conf`
      # -> e aggiungendo nella sezione dei volumi:
      # `./certs/ca/ca.crt:/ca/ca.crt:ro`

    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
     # - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_ROLE=splunk_standalone
      - SPLUNK_HOME_OWNERSHIP_ENFORCEMENT=false
      - SPLUNK_DISABLE_POPUPS=true
      - SPLUNK_HOME_OWNERSHIP_ENFORCEMENT=true
      - SPLUNK_USER=root

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/en-US/account/login"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 4: DATA - MongoDB
  # ============================================================================

  db_primary:
    image: mongo:7.0
    container_name: db_primary
    hostname: mongo-primary
    restart: unless-stopped

    networks:
      backend_net:
        ipv4_address: 172.20.3.5

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./certs/mongodb:/certs/mongodb:ro
      - ./configs/mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./configs/mongodb/init-scripts:/docker-entrypoint-initdb.d:ro
      - mongo_audit_logs:/var/log/mongodb

    command: ["mongod", "--config", "/etc/mongod.conf"]

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--host",
          "172.20.3.5", # "db_primary",
          "--tls",
          "--tlsCAFile",
          "/certs/mongodb/ca.crt",
          "--username",
          "${MONGO_ROOT_USER}",
          "--password",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 4: API BACKEND - MongoDB Data Access
  # ============================================================================

  api_backend:
    build:
      context: ./services/api_backend
      dockerfile: Dockerfile
    container_name: api_backend
    hostname: api_backend
    restart: unless-stopped

    networks:
      backend_net:
        ipv4_address: 172.20.3.20

    volumes:
      - ./certs/mongodb/ca.crt:/certs/mongodb/ca.crt:ro

    environment:
      - PORT=3000
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_TLS_CA_FILE=${MONGO_TLS_CA_FILE}

    depends_on:
      db_primary:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.get('http://127.0.0.1:3000/health',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1)});"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 3: DECISION - OPA Policy Engine
  # ============================================================================

  pdp_engine:
    image: openpolicyagent/opa:latest-envoy
    container_name: pdp_engine
    hostname: opa-policy
    restart: unless-stopped
    working_dir: /usr/share/opa-app

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.6
      monitoring_net:
        ipv4_address: 172.20.4.6
      corporate_net:
        ipv4_address: 172.20.10.6
      vpn_net:
        ipv4_address: 172.20.11.6
      satellite_net:
        ipv4_address: 172.20.12.6
      public_net:
        ipv4_address: 172.20.13.6

    ports:
      - "8181:8181"
      - "9191:9191"

    volumes:
      - ./configs/opa/config.yaml:/config/opa-config.yaml:ro
      - ./configs/opa/policies/test-policy.rego:/policies/test-policy.rego:ro
      - ./configs/opa/data/roles.json:/policies/roles.json:ro
      - ./configs/opa/data/devices.json:/policies/devices.json:ro
      - ./configs/opa/data/networks.json:/policies/networks.json:ro
      - ./configs/opa/data/access_rules.json:/policies/access_rules.json:ro

      #- ./configs/opa/data/risk_data/risk_scores.json:/policies/risk_scores.json:ro
      # AGGIUNGI — monta l'intera cartella risk_data
      - ./configs/opa/data/risk_data:/policies/risk_data

    environment:
      - SPLUNK_HEC_URL=http://siem_central:8088/services/collector/event
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - MONGODB_HOST=db_primary
      - MONGODB_PORT=27017

    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--config-file=/config/opa-config.yaml"
      - "--log-level=debug"
      - "--log-format=json"
      - "--watch"
      - "/policies"

    depends_on:
      siem_central:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 2: ENFORCEMENT - Envoy Proxy PEP
  # ============================================================================

  pep_gateway:
    build:
      context: ./services/envoy
      dockerfile: Dockerfile
    container_name: pep_gateway
    hostname: envoy-gateway
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.7
      backend_net:
        ipv4_address: 172.20.3.7
#      corporate_net:
#        ipv4_address: 172.20.10.7
#      vpn_net:
#        ipv4_address: 172.20.11.7
#      satellite_net:
#        ipv4_address: 172.20.12.7
#      public_net:
#        ipv4_address: 172.20.13.7

    ports:
      - "8443:8443"
      - "127.0.0.1:9901:9901"

    volumes:
      - ./configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./configs/envoy/mongo_inspector.lua:/etc/envoy/mongo_inspector.lua:ro
      - ./certs/server:/certs:ro
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - envoy_logs:/var/log/envoy

    environment:
      - OPA_HOST=pdp_engine
      - OPA_PORT=9191
      - API_BACKEND_HOST=api_backend
      - API_BACKEND_PORT=3000
      - SPLUNK_HEC_URL=https://siem_central:8088/services/collector/event
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}

    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]

    depends_on:
      pdp_engine:
        condition: service_healthy
      api_backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9901/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 1: NETWORK SECURITY - NFTables Firewall
  # ============================================================================

  firewall_perimeter:
    build:
      context: ./services/nftables
      dockerfile: Dockerfile
    container_name: firewall_perimeter
    hostname: nft-firewall
    restart: unless-stopped

    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.10
      backend_net:
        ipv4_address: 172.20.3.10
      monitoring_net:
        ipv4_address: 172.20.4.10
      corporate_net:
        ipv4_address: 172.20.10.10
      vpn_net:
        ipv4_address: 172.20.11.10
      satellite_net:
        ipv4_address: 172.20.12.10
      public_net:
        ipv4_address: 172.20.13.10

    cap_add:
      - NET_ADMIN

    volumes:
      - ./configs/nftables/rules.nft:/etc/nftables/rules.nft:ro
      #- nftables_logs:/var/log/nftables
      #- ./certs/ca/ca.crt:/ca/ca.crt:ro

    environment:
      # NFTables - Target Service IPs
      - NFTABLES_ENVOY_IP=${NFTABLES_ENVOY_IP:-172.20.2.7}
      - NFTABLES_MONGODB_IP=${NFTABLES_MONGODB_IP:-172.20.3.5}
      - NFTABLES_SPLUNK_IP=${NFTABLES_SPLUNK_IP:-172.20.4.8}
      - NFTABLES_OPA_IP=${NFTABLES_OPA_IP:-172.20.2.6}
      - NFTABLES_API_IP=${NFTABLES_API_IP:-172.20.3.20}
      - NFTABLES_SNORT_IP=${NFTABLES_SNORT_IP:-172.20.4.11}
      # NFTables - Target Networks IPs
      - NFTABLES_CORPORATE_NET=${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      - NFTABLES_VPN_NET=${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      - NFTABLES_SATELLITE_NET=${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      - NFTABLES_PUBLIC_NET=${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}
      # NFTables - Service Ports
      - NFTABLES_PEP_PORT=${NFTABLES_PEP_PORT:-8443}
      - NFTABLES_OPA_PORTS=${NFTABLES_OPA_PORTS:-{8181,9191}}
      - NFTABLES_MONGO_PORT=${NFTABLES_MONGO_PORT:-27017}
      - NFTABLES_API_PORT=${NFTABLES_API_PORT:-3000}
      - NFTABLES_SIEM_HEC_PORT=${NFTABLES_SIEM_HEC_PORT:-8088}
      - NFTABLES_SIEM_WEB_PORT=${NFTABLES_SIEM_WEB_PORT:-8000}
      - NFTABLES_ENVOY_ADMIN_PORT=${NFTABLES_ENVOY_ADMIN_PORT:-9901}
      # NFTables - Splunk Connection
      - NFTABLES_SPLUNK_HEC_URL=https://siem_central:8088/services/collector/event
      - NFTABLES_SPLUNK_HEC_TOKEN=${NFTABLES_SPLUNK_HEC_TOKEN}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 1: NETWORK SECURITY - Snort IDS
  # ============================================================================

  ids_network_monitor:
    build:
      context: ./services/snort
      dockerfile: Dockerfile
    container_name: ids_network_monitor
    hostname: snort-ids
    restart: unless-stopped

    # --- SECURITY & ZERO TRUST ---
    privileged: false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined

    # --- NETWORKING (The "Black Box") ---
    networks:
      zerotrust_net:
        ipv4_address: 172.20.2.11
      backend_net:
        ipv4_address: 172.20.3.11
      monitoring_net:
        ipv4_address: 172.20.4.11
      corporate_net:
        ipv4_address: 172.20.10.11
      vpn_net:
        ipv4_address: 172.20.11.11
      satellite_net:
        ipv4_address: 172.20.12.11
      public_net:
        ipv4_address: 172.20.13.11

    # --- DATA PERSISTENCE & FILE MAPPING ---
    volumes:
      - ./configs/snort/snort-zta.lua:/etc/snort/snort-zta.lua:ro
      - ./configs/snort/snort-zta.rules:/etc/snort/snort-zta.rules:ro
      - ./services/snort/entrypoint.sh:/scripts/entrypoint.sh:ro
      - snort_logs:/var/log/snort

    # --- ENVIRONMENT VARIABLES ---
    environment:
      - TZ=${TZ}
      # NETWORK TOPOLOGY VARIABLES (CIDRs)
      - ZTA_HOME_NET=[172.20.2.0/24,172.20.3.0/24,172.20.4.0/24,172.20.10.0/24,172.20.11.0/24,172.20.12.0/24,172.20.13.0/24]
      - ZTA_PUBLIC_NET=${NETWORK_PUBLIC_SUBNET:-172.20.13.0/24}
      - ZTA_VPN_NET=${NETWORK_VPN_SUBNET:-172.20.11.0/24}
      - ZTA_SATELLITE_NET=${NETWORK_SATELLITE_SUBNET:-172.20.12.0/24}
      - ZTA_CORPORATE_NET=${NETWORK_CORPORATE_SUBNET:-172.20.10.0/24}
      - ZTA_BACKEND_NET=${NETWORK_BACKEND_SUBNET:-172.20.3.0/24}
      - ZTA_SNORT_INTERFACES=${ZTA_SNORT_INTERFACES}
      # CRITICAL PORT DEFINITIONS
      - ZTA_PEP_PORT=${SNORT_PORT_PEP:-8443}
      - ZTA_OPA_PORTS=${SNORT_PORT_OPA}
      - ZTA_MONGO_PORT=${SNORT_PORT_MONGO:-27017}
      - ZTA_API_PORT=${SNORT_PORT_API:-3000}
      - ZTA_SIEM_PORTS=${SNORT_PORT_SIEM}
      - ZTA_ADMIN_PORT=${SNORT_PORT_ADMIN:-9901}

    # --- ORCHESTRATION ---
    depends_on:
      siem_central:
        condition: service_healthy

    # --- HEALTH MONITORING (Healthcheck) ---
    healthcheck:
      test: [ "CMD", "pgrep", "snort" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # --- DOCKER LOG MANAGEMENT ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # LAYER 0: DEVICE HARDWARE IDENTITY - SWTPM
  # ============================================================================
  # Ogni container SWTPM rappresenta il TPM emulato di un dispositivo.
  # Il TPM appartiene al device, non all'utente.

  swtpm_d001:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_d001
    hostname: swtpm-d001
    restart: unless-stopped

    networks:
      vpn_net:
        ipv4_address: 172.20.11.30

    volumes:
      - swtpm_d001_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  swtpm_d002:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_d002
    hostname: swtpm-d002
    restart: unless-stopped

    networks:
      satellite_net:
        ipv4_address: 172.20.12.30

    volumes:
      - swtpm_d002_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  swtpm_dsoc:
    build:
      context: ./services/swtpm
      dockerfile: Dockerfile
    container_name: swtpm_dsoc
    hostname: swtpm-dsoc
    restart: unless-stopped

    networks:
      corporate_net:
        ipv4_address: 172.20.10.30

    volumes:
      - swtpm_dsoc_state:/var/lib/swtpm

    environment:
      - TPM_STATE_DIR=/var/lib/swtpm
      - TPM_SERVER_PORT=2321
      - TPM_CTRL_PORT=2322

    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # TESTING CLIENTS TPM-BACKED
  # ============================================================================
  # Questi container rappresentano dispositivi con TPM.
  # L'utente applicativo viene passato con USER_ID e può cambiare nei test.

  client_d001_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_d001_tpm
    hostname: client-d001-tpm
    restart: "no"

    networks:
      vpn_net:
        ipv4_address: 172.20.11.31

    volumes:
      - ./certs/devices/D-001:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_d001_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DEVICE_ID=D-001
      - DEVICE_LOCATION=Terminal-Ancona
      - USER_ID=operatore_ancona
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000001
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_d001,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_d001,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_d001:
        condition: service_started
      pep_gateway:
        condition: service_started

    command: ["tail", "-f", "/dev/null"]
    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_d002_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_d002_tpm
    hostname: client-d002-tpm
    restart: "no"

    networks:
      satellite_net:
        ipv4_address: 172.20.12.31

    volumes:
      - ./certs/devices/D-002:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_d002_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DEVICE_ID=D-002
      - DEVICE_LOCATION=Ponte-Comando
      - USER_ID=capitano_claudia
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000002
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_d002,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_d002,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_d002:
        condition: service_started
      pep_gateway:
        condition: service_started

    command: ["tail", "-f", "/dev/null"]
    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  client_dsoc_tpm:
    build:
      context: ./services/clients_tpm
      dockerfile: Dockerfile
    container_name: client_dsoc_tpm
    hostname: client-dsoc-tpm
    restart: "no"

    networks:
      corporate_net:
        ipv4_address: 172.20.10.31

    volumes:
      - ./certs/devices/D-SOC:/certs/device
      - ./certs/ca/ca.crt:/ca/ca.crt:ro
      - ./certs/ca/ca.key:/ca/ca.key:ro
      - tpm_dsoc_client_state:/tpm

    environment:
      - ENVOY_HOST=pep_gateway
      - ENVOY_PORT=8443
      - DEVICE_ID=D-SOC
      - DEVICE_LOCATION=SOC-Center
      - USER_ID=soc_admin
      - CLIENT_CERT=/certs/device/device.crt
      - CA_CERT=/ca/ca.crt
      - TPM_HANDLE=0x81000003
      - TPM2TOOLS_TCTI=swtpm:host=swtpm_dsoc,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=swtpm_dsoc,port=2321
      - OPENSSL_MODULES=/usr/local/lib/ossl-modules

    depends_on:
      swtpm_dsoc:
        condition: service_started
      pep_gateway:
        condition: service_started

    command: ["tail", "-f", "/dev/null"]
    profiles:
      - testing

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # TESTING CLIENTS LEGACY
  # ============================================================================
  # Questi client usano ancora device.key su file.
  # Dopo il provisioning TPM-backed dei certificati, per i test finali usare i client *_tpm.

#  client_operatore_ancona:
#    build:
#      context: ./services/clients
#      dockerfile: Dockerfile
#      args:
#        CLIENT_TYPE: operatore_ancona
#        CLIENT_ROLE: ruolo_banchina
#    container_name: client_operatore_ancona
#    hostname: client-operatore-ancona
#    restart: "no"
#
#    networks:
#      vpn_net:
#        ipv4_address: 172.20.11.20
#
#    volumes:
#      - ./certs/devices/D-001:/certs/device:ro
#      - ./certs/ca/ca.crt:/ca/ca.crt:ro
#      - ./services/clients/scripts:/scripts:ro
#
#    environment:
#      - ENVOY_HOST=pep_gateway
#      - ENVOY_PORT=8443
